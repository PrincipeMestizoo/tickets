<div class="auth-page">
  <div class="auth-card card animate-fade-up">
    <div class="auth-card__brand">
      <span class="auth-card__logo">HD</span>
      <h2>Bienvenido de nuevo</h2>
      <p>Inicia sesión para gestionar tus tickets de soporte</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-field">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" formControlName="email" placeholder="nombre@helpdesk.dev" autocomplete="email" />
        <span class="form-error" *ngIf="f['email'].touched && f['email'].invalid">
          Ingresa un correo válido.
        </span>
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
        <span class="form-error" *ngIf="f['password'].touched && f['password'].invalid">
          La contraseña debe tener al menos 6 caracteres.
        </span>
      </div>

      <p class="form-error auth-card__server-error" *ngIf="serverError">{{ serverError }}</p>

      <button class="btn btn-primary auth-card__submit" type="submit" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="auth-card__footer">
      ¿No tienes cuenta? <a routerLink="/auth/register">Regístrate como cliente</a>
    </p>
  </div>
</div>
